name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app.py
      - name: Test
        run: pytest -q
      - name: Ingest + ask (extractive, no API key)
        run: |
          python -m docqa.ingest
          python -m docqa.ask "How do I keep class proportions equal across CV folds?" --show-sources
      - name: Retrieval eval (TF-IDF)
        run: python -m docqa.evaluate --backend tfidf

  # The dense backend needs torch and a model download, so it gets its own job
  # (one Python version) instead of slowing down the matrix above.
  test-transformer:
    runs-on: ubuntu-latest
    env:
      RAG_REQUIRE_TRANSFORMER: "1"  # fail, don't skip, if the extra is broken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/docqa/config.py') }}
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,transformer]"
      - name: Test
        run: pytest -q
      - name: Ingest + ask (transformer backend)
        run: |
          python -m docqa.ingest --backend transformer --docs data/ml_notes
          python -m docqa.ask "my fraud model is 99% right but catches nothing" --show-sources
